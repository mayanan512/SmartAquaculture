<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
<defs>
<linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#061a3a"/>
<stop offset="100%" stop-color="#030d20"/>
</linearGradient>
<linearGradient id="pondActive" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#00b4d8" stop-opacity="0.45"/>
<stop offset="100%" stop-color="#0077b6" stop-opacity="0.75"/>
</linearGradient>
</defs>
<rect width="800" height="420" rx="12" fill="url(#bgGrad)" stroke="#00d4ff" stroke-width="2" stroke-opacity="0.5"/>
<!-- 网格线 -->
<g stroke="#00d4ff" stroke-opacity="0.12" stroke-width="1">
<line x1="0" y1="80" x2="800" y2="80"/><line x1="0" y1="160" x2="800" y2="160"/>
<line x1="0" y1="240" x2="800" y2="240"/><line x1="0" y1="320" x2="800" y2="320"/>
<line x1="160" y1="0" x2="160" y2="420"/><line x1="320" y1="0" x2="320" y2="420"/>
<line x1="480" y1="0" x2="480" y2="420"/><line x1="640" y1="0" x2="640" y2="420"/>
</g>
<text x="24" y="34" fill="#00f0ff" font-size="16" font-weight="bold">智渔云数字孪生园区平面拓扑 (SIMULATED 演示场景)</text>
