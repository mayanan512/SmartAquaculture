<text x="70" y="148" fill="#ffd166" font-size="12">状态: 在养 | 氨氮预警(0.46)</text>
<rect x="295" y="95" width="200" height="90" rx="6" fill="url(#pondActive)" stroke="#00f5d4" stroke-width="2"/>
<text x="310" y="125" fill="#ffffff" font-size="14" font-weight="bold">POND-A02 石斑鱼池</text>
<text x="310" y="148" fill="#06d6a0" font-size="12">状态: 在养 | 水质正常</text>
